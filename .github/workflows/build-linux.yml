name: Build Linux

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgtk-3-bin liblzma-dev zip

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux
        run: flutter build linux --release

      - name: Package zip
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../fast-chat-linux.zip .

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/512x512/apps
          cp -r build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp web/icons/Icon-512.png AppDir/usr/share/icons/hicolor/512x512/apps/fast-chat.png
          cat > AppDir/fast-chat.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Fast Chat
          Comment=LAN peer-to-peer chat client
          Exec=fast_chat
          Icon=fast-chat
          Categories=Network;Chat;
          Terminal=false
          EOF
          cp AppDir/fast-chat.desktop AppDir/usr/share/applications/fast-chat.desktop
          mkdir -p AppDir/usr/lib/x86_64-linux-gnu/gtk-3.0/3.0.0/immodules
          find /usr/lib -path '*/gtk-3.0/3.0.0/immodules/*.so' -exec cp -n {} AppDir/usr/lib/x86_64-linux-gnu/gtk-3.0/3.0.0/immodules/ \;
          gtk-query-immodules-3.0 AppDir/usr/lib/x86_64-linux-gnu/gtk-3.0/3.0.0/immodules/*.so > AppDir/usr/lib/x86_64-linux-gnu/gtk-3.0/3.0.0/immodules.cache
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          cd "$HERE/usr/bin"
          export GTK_IM_MODULE_FILE="$HERE/usr/lib/x86_64-linux-gnu/gtk-3.0/3.0.0/immodules.cache"
          export GTK_IM_MODULE="${GTK_IM_MODULE:-fcitx:ibus:xim}"
          export XMODIFIERS="${XMODIFIERS:-@im=fcitx}"
          exec "$HERE/usr/bin/fast_chat" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          OUTPUT=fast-chat-linux.AppImage ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir --desktop-file AppDir/fast-chat.desktop --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/fast-chat.png --output appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-chat-linux
          path: |
            fast-chat-linux.zip
            fast-chat-linux.AppImage
