name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath fast-chat-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fast-chat-windows
          path: fast-chat-windows.zip
